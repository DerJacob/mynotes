<!doctype html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex, nofollow">
<meta name="referrer" content="no-referrer">
<meta name="color-scheme" content="dark light">
<!--
  MyNotes Web-App (AH-1 + AH-2)
  - Liest die verschlüsselte PC-Kopie deiner Handy-Notizen aus deinem Google Drive
  - Schreibt nur in den eigenen Bereich „Vom PC“
  - Speichert NICHTS im Browser: kein localStorage, keine Cookies, kein Cache, kein Offline-Speicher
-->
<meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self' https://accounts.google.com/gsi/client; connect-src 'self' blob: https://www.googleapis.com https://accounts.google.com/gsi/; frame-src https://accounts.google.com/gsi/; style-src 'self' 'unsafe-inline' https://accounts.google.com/gsi/style; img-src 'self' blob: data: https://*.googleusercontent.com; font-src 'self'; object-src 'none'; base-uri 'none'; form-action 'none'">
<title>MyNotes</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Crect x='8' y='4' width='48' height='56' rx='10' fill='%23f4b400'/%3E%3Crect x='18' y='18' width='28' height='5' rx='2.5' fill='%23202124'/%3E%3Crect x='18' y='30' width='28' height='5' rx='2.5' fill='%23202124'/%3E%3Crect x='18' y='42' width='18' height='5' rx='2.5' fill='%23202124'/%3E%3C/svg%3E">
<link rel="stylesheet" href="app.css?v=1">
<script src="https://accounts.google.com/gsi/client" async defer></script>
<script type="module" src="app.js?v=1"></script>
</head>
<body>
<div id="app"><div class="boot"><div class="boot-logo"></div><p>MyNotes wird geladen …</p></div></div>
<noscript><p style="padding:24px">Bitte JavaScript aktivieren – ohne geht die Web-App nicht.</p></noscript>
</body>
</html>
